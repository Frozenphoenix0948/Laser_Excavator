plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

group = project.mod_group_id
version = project.mod_version
base { archivesName = project.mod_id }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

legacyForge {
    enable {
        neoForgeVersion = project.neo_version
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
    mods {
        laserexcavator {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url 'https://maven.neoforged.net/releases/' }
    maven { url 'https://maven.minecraftforge.net/' }
    maven { url 'https://maven.blamejared.com/' }
    maven { url 'https://www.cursemaven.com' }
}

// Dynamic Trees and JEI dependencies are deliberately NOT pulled into localRuntime.
// When their correct 1.20.1 artifacts have been identified, restore optional
// compile-time compatibility using modCompileOnly, not a required dependency.

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'laserexcavator.refmap.json'
    config 'laserexcavator.mixins.json'
}

tasks.named('jar', Jar) {
    manifest {
        attributes('MixinConfigs': 'laserexcavator.mixins.json')
    }
}
